[package]
name = "chip-core"
version = "1.1.0"
edition = "2021"
description = "SysMon Chip 的 no_std 核心：布局 / 文本 / GDI 绘制 / 指标采样"
license = "MIT"
repository = "https://github.com/zhaoxiagongsi001/sysmon-chip"

[lib]
name = "chip_core"
path = "src/lib.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
