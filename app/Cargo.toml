[package]
name = "sysmon-chip"
version = "0.3.0"
edition = "2021"
description = "Win11 极轻量资源条"
license = "MIT"
repository = "https://github.com/zhaoxiagongsi001/sysmon-chip"
authors = ["DSH"]
build = "build.rs"

[[bin]]
name = "SysMonChip"
path = "src/main.rs"

[dependencies]
chip-core = { path = "../chip_core" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false
debug-assertions = false





